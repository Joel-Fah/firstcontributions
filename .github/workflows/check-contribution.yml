name: Check contribution

# pull_request_target runs with the base repository's code and permissions, so first-time
# contributors get feedback right away, without a maintainer approving the workflow run.
# SECURITY: only the base branch is checked out. The pull request's files are downloaded
# through the API and parsed as YAML. Never check out, install or run code from the pull request here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      automerge: ${{ steps.check.outputs.automerge }}
    steps:
      - name: Check out trusted scripts (base branch)
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check contributor files
        id: check
        run: node scripts/check-pr.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE }}
          REPORT_PATH: report.md

      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = body.split('\n')[0];
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if the files need fixing
        if: steps.check.outputs.ok != 'true'
        run: |
          echo "::error::Some contributor files need fixing. See the comment on the pull request."
          exit 1

  # Optional: set the repository variable AUTO_MERGE to "true" to merge valid
  # contributor-only pull requests without waiting for a maintainer.
  merge:
    needs: check
    if: vars.AUTO_MERGE == 'true' && needs.check.outputs.automerge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge
        run: |
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA"
          # Merges made with GITHUB_TOKEN don't trigger push events, so start the deploy explicitly.
          gh workflow run deploy.yml --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
